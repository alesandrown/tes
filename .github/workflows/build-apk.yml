name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/temp-release.keystore -alias temp-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=App, OU=Dev, O=App, L=City, ST=State, C=ID"

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE=temp-release.keystore -PMYAPP_UPLOAD_KEY_ALIAS=temp-alias -PMYAPP_UPLOAD_STORE_PASSWORD=android123 -PMYAPP_UPLOAD_KEY_PASSWORD=android123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: E-Ujian Browser
          path: android/app/build/outputs/apk/release/app-release.apk
